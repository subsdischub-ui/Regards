services:
  # One-shot schema sync, runs before the app on every deploy. The runtime
  # image is Next.js standalone output (no drizzle-kit, no src/), so schema
  # changes CANNOT be applied from the `app` container — this service reuses
  # the `builder` stage (full node_modules + drizzle.config.ts) instead.
  # `push --force` diffs the live DB against src/lib/db/schema.ts, so it is
  # idempotent and independent of the migrations journal.
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: postgresql://regards:${POSTGRES_PASSWORD}@postgres:5432/regards
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    # No `ports:` mapping — Dokploy/Traefik routes to the container via the
    # internal Docker network using the service name `app` + container port 3000.
    # Publishing 3000 on the host would conflict with Dokploy's own admin UI.
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://regards:${POSTGRES_PASSWORD}@postgres:5432/regards
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: regards
      MINIO_USE_SSL: "false"
      GOOGLE_SERVICE_ACCOUNT_KEY: ${GOOGLE_SERVICE_ACCOUNT_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_WEDDING_DATE: "2026-05-23"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regards
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: regards
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regards"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
